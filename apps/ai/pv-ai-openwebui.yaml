apiVersion: v1
kind: PersistentVolume
metadata:
  name: ai-openwebui
spec:
  accessModes:
  - ReadWriteOnce
  capacity:
    storage: 5Gi
  claimRef:
    kind: PersistentVolumeClaim
    name: openwebui-data
    namespace: ai
    apiVersion: v1
  hostPath:
    path: /mnt/media4/_ai-stack/openwebui
    type: DirectoryOrCreate
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ai-manual
  volumeMode: Filesystem
