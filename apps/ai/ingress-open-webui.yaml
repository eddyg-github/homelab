apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.middlewares: ai-lan-only@kubernetescrd
  name: open-webui
  namespace: ai
spec:
  ingressClassName: traefik
  rules:
  - host: chat.lyxar.dedyn.io
    http:
      paths:
      - backend:
          service:
            name: open-webui
            port:
              number: 8080
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - chat.lyxar.dedyn.io
    secretName: chat-tls
