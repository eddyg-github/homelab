apiVersion: v1
kind: PersistentVolume
metadata:
  name: ai-qdrant
spec:
  accessModes:
  - ReadWriteOnce
  capacity:
    storage: 20Gi
  claimRef:
    kind: PersistentVolumeClaim
    name: qdrant-data
    namespace: ai
    apiVersion: v1
  hostPath:
    path: /mnt/media4/_ai-stack/qdrant
    type: DirectoryOrCreate
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ai-manual
  volumeMode: Filesystem
