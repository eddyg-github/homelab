apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  namespace: ai
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: valkey
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: valkey
      annotations:
        backup.velero.io/backup-volumes: data
    spec:
      containers:
      - args:
        - --requirepass
        - $(VALKEY_PASSWORD)
        - --maxmemory
        - 128mb
        - --maxmemory-policy
        - allkeys-lru
        - --appendonly
        - 'yes'
        command:
        - valkey-server
        env:
        - name: VALKEY_PASSWORD
          valueFrom:
            secretKeyRef:
              key: VALKEY_PASSWORD
              name: ai-core
        image: valkey/valkey:8-alpine
        imagePullPolicy: IfNotPresent
        name: valkey
        ports:
        - containerPort: 6379
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          periodSeconds: 10
          successThreshold: 1
          tcpSocket:
            port: 6379
          timeoutSeconds: 1
        resources:
          limits:
            cpu: 200m
            memory: 192Mi
          requests:
            cpu: 50m
            memory: 64Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /data
          name: data
      dnsPolicy: ClusterFirst
      priorityClassName: ai-low
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: valkey-data
      initContainers:
      - name: boot-delay
        image: busybox:1.36
        command:
        - sh
        - -c
        - T=1500; U=$(cut -d. -f1 /proc/uptime); [ "$U" -lt "$T" ] && sleep $((T-U)); exit 0
        resources:
          requests:
            cpu: 1m
            memory: 4Mi
          limits:
            memory: 16Mi
