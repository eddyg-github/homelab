apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: 'true'
  name: planigrafo-ingress
  namespace: planigrafo
spec:
  ingressClassName: traefik
  rules:
  - host: planigrafo.lyxar.dedyn.io
    http:
      paths:
      - backend:
          service:
            name: frontend-service
            port:
              number: 80
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - planigrafo.lyxar.dedyn.io
    secretName: planigrafo-tls-secret
