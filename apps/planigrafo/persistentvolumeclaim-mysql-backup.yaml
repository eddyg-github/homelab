apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-backup
  namespace: planigrafo
  annotations:
    backup.velero.io/exclude-from-backup: "true"
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: local-path
  volumeMode: Filesystem
