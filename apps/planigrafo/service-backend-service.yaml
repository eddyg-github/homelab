apiVersion: v1
kind: Service
metadata:
  labels:
    app: backend
  name: backend-service
  namespace: planigrafo
spec:
  ports:
  - name: http
    port: 3000
    protocol: TCP
    targetPort: 3000
  - name: metrics
    port: 9464
    protocol: TCP
    targetPort: 9464
  selector:
    app: backend
  type: ClusterIP
