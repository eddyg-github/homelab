apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-server
  namespace: immich
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: immich-server
  template:
    metadata:
      labels:
        app: immich-server
    spec:
      initContainers:
      - name: boot-delay
        image: busybox:1.36
        command:
        - sh
        - -c
        - T=1200; U=$(cut -d. -f1 /proc/uptime); [ "$U" -lt "$T" ] && sleep $((T-U)); exit 0
        resources:
          requests:
            cpu: 1m
            memory: 4Mi
          limits:
            memory: 16Mi
      - name: wait-db
        image: busybox:1.36
        command:
        - sh
        - -c
        - until nc -z im-postgres 5432 && nc -z im-valkey 6379; do sleep 3; done
      containers:
      - name: server
        image: ghcr.io/immich-app/immich-server:v3.4.1
        ports:
        - containerPort: 2283
        env:
        - name: DB_HOSTNAME
          value: im-postgres
        - name: DB_USERNAME
          value: immich
        - name: DB_DATABASE_NAME
          value: immich
        - name: REDIS_HOSTNAME
          value: im-valkey
        - name: IMMICH_MACHINE_LEARNING_ENABLED
          value: 'false'
        - name: TZ
          value: America/Argentina/Buenos_Aires
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: im-env
              key: DB_PASSWORD
        readinessProbe:
          httpGet:
            path: /api/server/ping
            port: 2283
          periodSeconds: 15
          failureThreshold: 40
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 2Gi
        volumeMounts:
        - name: upload
          mountPath: /data
      volumes:
      - name: upload
        hostPath:
          path: /mnt/media3/immich
          type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: immich-server
  namespace: immich
spec:
  selector:
    app: immich-server
  ports:
  - name: http
    port: 2283
    targetPort: 2283
