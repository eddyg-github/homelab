apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: {name: lan-only, namespace: immich}
spec:
  ipAllowList:
    sourceRange: ["192.168.1.0/24", "100.64.0.0/10", "127.0.0.1/32", "10.8.0.0/24", "181.81.127.149/32"]
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: {name: ratelimit, namespace: immich}
spec:
  rateLimit: {average: 100, period: 1s, burst: 200}
