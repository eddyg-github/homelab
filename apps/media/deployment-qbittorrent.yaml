apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    field.cattle.io/publicEndpoints: '[{"port":30081,"protocol":"TCP","serviceName":"media:qbittorrent","allNodes":true}]'
  name: qbittorrent
  namespace: media
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: qbittorrent
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: qbittorrent
    spec:
      containers:
      - env:
        - name: WEBUI_PORT
          value: '8080'
        image: lscr.io/linuxserver/qbittorrent
        imagePullPolicy: Always
        name: qbittorrent
        ports:
        - containerPort: 8080
          protocol: TCP
        resources:
          limits:
            memory: 1Gi
          requests:
            cpu: 20m
            memory: 128Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /downloads
          name: media
        - mountPath: /config
          name: config
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - name: media
        persistentVolumeClaim:
          claimName: media-pvc
      - name: config
        persistentVolumeClaim:
          claimName: qbittorrent-config

