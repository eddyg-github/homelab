apiVersion: v1
kind: Service
metadata:
  annotations:
    field.cattle.io/publicEndpoints: '[{"port":30081,"protocol":"TCP","serviceName":"media:qbittorrent","allNodes":true}]'
  name: qbittorrent
  namespace: media
spec:
  externalTrafficPolicy: Cluster
  ports:
  - port: 8080
    protocol: TCP
    targetPort: 8080
  selector:
    app: qbittorrent
  type: ClusterIP
