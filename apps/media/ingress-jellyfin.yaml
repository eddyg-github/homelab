apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
  name: jellyfin
  namespace: media
spec:
  ingressClassName: traefik
  rules:
  - host: jellyfin.lyxar.dedyn.io
    http:
      paths:
      - backend:
          service:
            name: jellyfin
            port:
              number: 8096
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - jellyfin.lyxar.dedyn.io
    secretName: jellyfin-tls
