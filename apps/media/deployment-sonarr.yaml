apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    field.cattle.io/publicEndpoints: '[{"port":30089,"protocol":"TCP","serviceName":"media:sonarr","allNodes":true}]'
  name: sonarr
  namespace: media
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: sonarr
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: sonarr
    spec:
      containers:
      - image: lscr.io/linuxserver/sonarr
        imagePullPolicy: Always
        name: sonarr
        ports:
        - containerPort: 8989
          protocol: TCP
        resources:
          limits:
            memory: 1Gi
          requests:
            cpu: 20m
            memory: 128Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /tv
          name: media
        - mountPath: /config
          name: config
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - name: media
        hostPath:
          path: /mnt/unified-media
          type: Directory
      - name: config
        persistentVolumeClaim:
          claimName: sonarr-config
