apiVersion: v1
kind: Service
metadata:
  annotations:
    field.cattle.io/publicEndpoints: '[{"port":30007,"protocol":"TCP","serviceName":"default:filebrowser","allNodes":true}]'
  name: filebrowser
  namespace: default
spec:
  ports:
  - port: 8080
    protocol: TCP
    targetPort: 8080
  selector:
    app: filebrowser
  type: ClusterIP
