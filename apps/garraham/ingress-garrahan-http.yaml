apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: garraham-redirect-https@kubernetescrd
  name: garrahan-ingress-http
  namespace: garraham
spec:
  ingressClassName: traefik
  rules:
  - host: garrahan.lyxar.dedyn.io
    http:
      paths:
      - backend:
          service:
            name: frontend-service
            port:
              number: 80
        path: /
        pathType: Prefix
