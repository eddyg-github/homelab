apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-backup-holder
  namespace: garraham
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mysql-backup-holder
  template:
    metadata:
      labels:
        app: mysql-backup-holder
      annotations:
        backup.velero.io/backup-volumes: backup
    spec:
      containers:
      - name: holder
        image: busybox:1.36
        command:
        - sh
        - -c
        - while true; do sleep 3600; done
        resources:
          requests:
            cpu: 5m
            memory: 8Mi
          limits:
            memory: 32Mi
        volumeMounts:
        - name: backup
          mountPath: /backup
      volumes:
      - name: backup
        persistentVolumeClaim:
          claimName: mysql-backup
      initContainers:
      - name: boot-delay
        image: busybox:1.36
        command:
        - sh
        - -c
        - T=180; U=$(cut -d. -f1 /proc/uptime); [ "$U" -lt "$T" ] && sleep $((T-U)); exit 0
        resources:
          requests:
            cpu: 1m
            memory: 4Mi
          limits:
            memory: 16Mi
