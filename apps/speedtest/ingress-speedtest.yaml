apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    speedtest.managed: 'true'
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
  name: speedtest
  namespace: speedtest
spec:
  ingressClassName: traefik
  rules:
  - host: speedtest.lyxar.dedyn.io
    http:
      paths:
      - backend:
          service:
            name: speedtest
            port:
              number: 80
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - speedtest.lyxar.dedyn.io
    secretName: speedtest-tls
