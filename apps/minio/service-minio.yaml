apiVersion: v1
kind: Service
metadata:
  annotations:
    field.cattle.io/publicEndpoints: '[{"port":32000,"protocol":"TCP","serviceName":"minio:minio","allNodes":true},{"port":32001,"protocol":"TCP","serviceName":"minio:minio","allNodes":true}]'
  name: minio
  namespace: minio
spec:
  externalTrafficPolicy: Cluster
  ports:
  - name: api
    nodePort: 32000
    port: 9000
    protocol: TCP
    targetPort: 9000
  - name: console
    nodePort: 32001
    port: 9001
    protocol: TCP
    targetPort: 9001
  selector:
    app: minio
  type: NodePort

