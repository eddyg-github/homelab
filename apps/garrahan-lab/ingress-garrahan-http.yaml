apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: garrahan-lab-redirect-https@kubernetescrd
  name: garrahan-lab-ingress-http
  namespace: garrahan-lab
spec:
  ingressClassName: traefik
  rules:
    - host: garrahan.lyxar.dedyn.io
      http:
        paths:
          - backend:
              service:
                name: frontend-service
                port:
                  number: 80
            path: /
            pathType: Prefix
