apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmalert
  namespace: monitoring
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: vmalert
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: vmalert
      annotations:
        checksum/rules: bf1ba4cffedf
    spec:
      containers:
      - args:
        - -datasource.url=http://victoriametrics.monitoring.svc.cluster.local:8428
        - -remoteWrite.url=http://victoriametrics.monitoring.svc.cluster.local:8428
        - -rule=/rules/rules.yaml
        - -evaluationInterval=60s
        - -notifier.url=http://alertmanager.monitoring.svc.cluster.local:9093
        image: victoriametrics/vmalert:v1.93.4
        imagePullPolicy: IfNotPresent
        name: vmalert
        ports:
        - containerPort: 8880
          protocol: TCP
        resources:
          limits:
            cpu: 200m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /rules
          name: rules
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - configMap:
          defaultMode: 420
          name: vmalert-rules
        name: rules
