apiVersion: v1
data:
  rules.yaml: "groups:\n  - name: cluster-health\n    interval: 60s\n    rules:\n\
    \      - alert: PodCrashLooping\n        expr: rate(kube_pod_container_status_restarts_total[5m])\
    \ > 0\n        for: 2m\n        labels:\n          severity: warning\n       \
    \ annotations:\n          summary: \"Pod {{ $labels.pod }} reiniciando en {{ $labels.namespace\
    \ }}\"\n      - alert: PodNotRunning\n        expr: kube_pod_status_phase{phase!=\"\
    Running\",phase!=\"Succeeded\"} == 1\n        for: 5m\n        labels:\n     \
    \     severity: critical\n        annotations:\n          summary: \"Pod {{ $labels.pod\
    \ }} en estado {{ $labels.phase }}\"\n      - alert: HighMemoryUsage\n       \
    \ expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes\
    \ > 0.90\n        for: 5m\n        labels:\n          severity: warning\n    \
    \    annotations:\n          summary: \"Memoria al {{ $value | humanizePercentage\
    \ }}\"\n"
kind: ConfigMap
metadata:
  name: vmalert-rules
  namespace: monitoring

