apiVersion: v1
data:
  rules.yaml: |
    groups:
    - name: servidor
      interval: 60s
      rules:
      - alert: NodeExporterDown
        expr: up{job="node-exporter"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: 'node-exporter no responde: no hay métricas del servidor'
      - alert: HighMemoryUsage
        expr: 1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes > 0.90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Memoria del servidor al {{ $value | humanizePercentage }}
      - alert: HighCPU
        expr: 1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) > 0.90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: CPU del servidor al {{ $value | humanizePercentage }} durante 10 min
      - alert: HighIOWait
        expr: avg(rate(node_cpu_seconds_total{mode="iowait"}[5m])) > 0.20
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'Los discos están frenando al CPU (iowait {{ $value | humanizePercentage }}): Jellyfin puede cortarse'
      - alert: DiskBusy
        expr: rate(node_disk_io_time_seconds_total{device=~"sd[a-d]"}[5m]) > 0.90
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Disco {{ $labels.device }} saturado ({{ $value | humanizePercentage }} ocupado)
      - alert: SystemDiskLow
        expr: node_filesystem_avail_bytes{mountpoint="/"} < 25 * 1024 * 1024 * 1024
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Disco del sistema con solo {{ $value | humanize1024 }}B libres
      - alert: SystemDiskCritical
        expr: node_filesystem_avail_bytes{mountpoint="/"} < 10 * 1024 * 1024 * 1024
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'Disco del sistema casi lleno: {{ $value | humanize1024 }}B libres. k3s puede desalojar pods'
      - alert: MediaDiskLow
        expr: node_filesystem_avail_bytes{mountpoint=~"/mnt/media[234]"} / node_filesystem_size_bytes{mountpoint=~"/mnt/media[234]"} < 0.05
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Disco {{ $labels.mountpoint }} con menos del 5% libre
      - alert: FilesystemReadOnly
        expr: node_filesystem_readonly{mountpoint=~"/|/mnt/media[234]"} == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: '{{ $labels.mountpoint }} pasó a solo lectura (posible falla de disco)'
      - alert: HighTemperature
        expr: node_hwmon_temp_celsius > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Temperatura alta: {{ $value }} C en {{ $labels.chip }}'
      - alert: ServerRebooted
        expr: node_time_seconds - node_boot_time_seconds < 600
        labels:
          severity: info
        annotations:
          summary: El servidor se reinició hace menos de 10 minutos
    - name: kubernetes
      interval: 60s
      rules:
      - alert: ScrapeTargetDown
        expr: up == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: No hay métricas de {{ $labels.job }} ({{ $labels.instance }})
      - alert: NodeNotReady
        expr: kube_node_status_condition{condition="Ready",status="true"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: El nodo {{ $labels.node }} no está Ready
      - alert: PodCrashLooping
        expr: increase(kube_pod_container_status_restarts_total[15m]) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.namespace }}/{{ $labels.pod }} se reinicia en bucle'
      - alert: PodNotRunning
        expr: sum by (namespace, pod) (kube_pod_status_phase{phase=~"Pending|Unknown|Failed"}) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.namespace }}/{{ $labels.pod }} no está corriendo'
      - alert: DeploymentUnavailable
        expr: kube_deployment_status_replicas_available < kube_deployment_spec_replicas
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.namespace }}/{{ $labels.deployment }} sin todas sus réplicas disponibles'
      - alert: ContainerOOMKilled
        expr: (increase(kube_pod_container_status_restarts_total[10m]) > 0) and on(namespace, pod, container) (kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1)
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.namespace }}/{{ $labels.pod }} fue matado por falta de memoria (OOM)'
      - alert: ContainerMemoryNearLimit
        expr: max by (namespace, pod, container) (container_memory_working_set_bytes{container!="",container!="POD"}) / on(namespace, pod, container) max by (namespace, pod, container) (kube_pod_container_resource_limits{resource="memory"})
          > 0.90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.namespace }}/{{ $labels.pod }} usa {{ $value | humanizePercentage }} de su límite de memoria'
      - alert: PVCPending
        expr: kube_persistentvolumeclaim_status_phase{phase="Pending"} == 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} sin volumen
    - name: plataforma
      interval: 60s
      rules:
      - alert: CertExpiringSoon
        expr: certmanager_certificate_expiration_timestamp_seconds - time() < 14 * 24 * 3600
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: El certificado {{ $labels.namespace }}/{{ $labels.name }} vence en menos de 14 días
      - alert: CertNotReady
        expr: certmanager_certificate_ready_status{condition="True"} == 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: El certificado {{ $labels.namespace }}/{{ $labels.name }} no está Ready
      - alert: ArgoAppOutOfSync
        expr: argocd_app_info{sync_status!="Synced"} == 1
        for: 20m
        labels:
          severity: warning
        annotations:
          summary: La app {{ $labels.name }} de ArgoCD no coincide con Git
      - alert: ArgoAppUnhealthy
        expr: argocd_app_info{health_status!~"Healthy|Progressing"} == 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: La app {{ $labels.name }} de ArgoCD está {{ $labels.health_status }}
      - alert: TraefikHigh5xx
        expr: sum(rate(traefik_service_requests_total{code=~"5.."}[5m])) / sum(rate(traefik_service_requests_total[5m])) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Más del 5% de las peticiones web dan error 5xx
      - alert: MinIODown
        expr: up{job="minio"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: MinIO no responde (los backups de Velero dependen de él)
      - alert: VeleroBackupStale
        expr: time() - velero_backup_last_successful_timestamp{schedule="daily"} > 129600
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: El último backup diario exitoso tiene más de 36 horas
      - alert: VeleroBackupFailed
        expr: increase(velero_backup_failure_total{schedule="daily"}[1d]) > 0
        labels:
          severity: warning
        annotations:
          summary: Falló un backup diario de Velero en las últimas 24 horas
    - name: host
      interval: 60s
      rules:
      - alert: SmartFailing
        expr: lab_smart_passed == 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: 'SMART reporta FALLA en el disco {{ $labels.device }}: hacer backup ya'
      - alert: SmartPendingSector
        expr: lab_smart_attribute_raw{name="current_pending_sector"} > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'Disco {{ $labels.device }}: {{ $value }} sector(es) pendientes de reasignar (posible inicio de falla)'
      - alert: SmartBadSectors
        expr: lab_smart_attribute_raw{name=~"reallocated_sector_ct|offline_uncorrectable|reported_uncorrect"} > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'Disco {{ $labels.device }}: {{ $labels.name }} = {{ $value }}'
      - alert: SmartCRCGrowing
        expr: increase(lab_smart_attribute_raw{name="udma_crc_error_count"}[1h]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: 'Disco {{ $labels.device }} sigue sumando errores CRC: revisar cable SATA o puerto'
      - alert: DiskTemperature
        expr: lab_smart_attribute_raw{name="temperature_celsius"} > 55
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Disco {{ $labels.device }} a {{ $value }} C
      - alert: PendingUpdates
        expr: lab_pending_updates > 0
        for: 1h
        labels:
          severity: info
        annotations:
          summary: '{{ $value }} actualizacion(es) pendiente(s) de {{ $labels.source }}. Aplicar a mano: sudo /usr/local/bin/updn'
      - alert: PendingSecurityUpdates
        expr: lab_pending_security_updates > 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: '{{ $value }} actualizacion(es) de SEGURIDAD pendiente(s) en apt'
      - alert: RebootRequired
        expr: lab_reboot_required == 1
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: El servidor necesita reiniciarse por una actualizacion
      - alert: SystemdUnitsFailed
        expr: lab_systemd_failed_units > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: '{{ $value }} servicio(s) de systemd fallido(s) en el host (systemctl --failed)'
      - alert: AptUpdateFailing
        expr: lab_apt_update_ok == 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: 'apt-get update falla: no se pueden detectar actualizaciones'
      - alert: HostCollectorStale
        expr: time() - lab_host_metrics_timestamp_seconds > 1800
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: El recolector de metricas del host dejo de actualizar (systemctl status lab-host-metrics.timer)
      - alert: DockerDown
        expr: lab_docker_up == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: El demonio Docker no responde
      - alert: DockerContainerStopped
        expr: lab_docker_container_running == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: El contenedor Docker {{ $labels.name }} no esta corriendo
      - alert: LocalstackDown
        expr: lab_localstack_up == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: LocalStack no responde en el puerto 4566 (si lo apagaste a proposito, silenciar esta alerta)
      - alert: HighIOPressure
        expr: rate(node_pressure_io_stalled_seconds_total[5m]) > 0.25
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: 'I/O: procesos detenidos esperando disco el {{ $value | humanizePercentage }} del tiempo'
      - alert: HighMemoryPressure
        expr: rate(node_pressure_memory_stalled_seconds_total[5m]) > 0.10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'Memoria: procesos detenidos por falta de RAM el {{ $value | humanizePercentage }} del tiempo'
      - alert: UpdnFailed
        expr: lab_updn_last_run_ok == 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: 'La actualizacion automatica (updn) fallo. Ver: sudo tail -50 /var/log/updn.log'
      - alert: UpdnStale
        expr: time() - lab_updn_last_success_timestamp_seconds > 3 * 86400
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: Hace mas de 3 dias que updn no termina con exito
    - name: guacamole
      interval: 60s
      rules:
      - alert: GuacamoleLoginFailures
        expr: sum(increase(traefik_service_requests_total{service=~".*guacamole.*",code="403"}[10m])) > 10
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: Muchos intentos fallidos de login en Guacamole en 10 minutos (posible fuerza bruta)
      - alert: GuacamoleDumpStale
        expr: time() - kube_cronjob_status_last_successful_time{cronjob="guac-pgdump"} > 129600
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: El pg_dump de Guacamole no termina con exito hace mas de 36 horas
kind: ConfigMap
metadata:
  name: vmalert-rules
  namespace: monitoring
