apiVersion: v1
data:
  config.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      prometheus:
        config:
          scrape_configs:
          - job_name: kube-state-metrics
            static_configs:
            - targets:
              - kube-state-metrics.kube-system.svc.cluster.local:8080
          - job_name: coredns
            static_configs:
            - targets:
              - kube-dns.kube-system.svc.cluster.local:9153
          - job_name: cert-manager
            static_configs:
            - targets:
              - cert-manager.cert-manager.svc.cluster.local:9402
          - job_name: argocd
            static_configs:
            - targets:
              - argocd-metrics.argocd.svc.cluster.local:8082
              - argocd-server-metrics.argocd.svc.cluster.local:8083
    processors:
      memory_limiter:
        check_interval: 5s
        limit_mib: 384
        spike_limit_mib: 128
      batch:
        timeout: 5s
        send_batch_size: 1000
    exporters:
      prometheusremotewrite:
        endpoint: http://victoriametrics.monitoring.svc.cluster.local:8428/api/v1/write
      debug:
        verbosity: basic
    service:
      extensions:
      - health_check
      pipelines:
        metrics:
          receivers:
          - otlp
          - prometheus
          processors:
          - memory_limiter
          - batch
          exporters:
          - prometheusremotewrite
        traces:
          receivers:
          - otlp
          processors:
          - memory_limiter
          - batch
          exporters:
          - debug
        logs:
          receivers:
          - otlp
          processors:
          - memory_limiter
          - batch
          exporters:
          - debug
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: monitoring
