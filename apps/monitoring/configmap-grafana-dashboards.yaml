apiVersion: v1
data:
  cluster-overview.json: |+
    {
      "title": "Cluster Overview",
      "uid": "cluster-overview",
      "schemaVersion": 27,
      "panels": [
        {
          "type": "stat",
          "title": "Pods Running",
          "gridPos": {"x": 0, "y": 0, "w": 6, "h": 4},
          "targets": [{"expr": "count(kube_pod_status_phase{phase=\"Running\"})", "refId": "A"}]
        },
        {
          "type": "stat",
          "title": "Pods con Errores",
          "gridPos": {"x": 6, "y": 0, "w": 6, "h": 4},
          "targets": [{"expr": "count(kube_pod_status_phase{phase=~\"Failed|Unknown\"})", "refId": "A"}]
        },
        {
          "type": "stat",
          "title": "CrashLoopBackOff activos",
          "gridPos": {"x": 12, "y": 0, "w": 6, "h": 4},
          "targets": [{"expr": "count(kube_pod_container_status_waiting_reason{reason=\"CrashLoopBackOff\"})", "refId": "A"}]
        },
        {
          "type": "graph",
          "title": "Reinicios por pod (5m)",
          "gridPos": {"x": 0, "y": 4, "w": 24, "h": 8},
          "targets": [{"expr": "rate(kube_pod_container_status_restarts_total[5m]) > 0", "legendFormat": "{{namespace}}/{{pod}}", "refId": "A"}]
        }
      ],
      "time": {"from": "now-1h", "to": "now"},
      "refresh": "30s"
    }

  servidor-discos.json: |-
    {
      "title": "Servidor y discos",
      "uid": "servidor-discos",
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "tags": [
        "host",
        "discos"
      ],
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "SMART por disco",
          "description": "Resultado general de SMART por disco. Se asume 1 = pasó, 0 = falló.",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 8,
            "h": 4
          },
          "targets": [
            {
              "expr": "lab_smart_passed",
              "refId": "A",
              "legendFormat": "{{device}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "FALLA",
                      "color": "red"
                    },
                    "1": {
                      "text": "OK",
                      "color": "green"
                    }
                  }
                }
              ]
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "textMode": "value_and_name",
            "graphMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Temperatura máx. (hwmon)",
          "description": "",
          "gridPos": {
            "x": 8,
            "y": 0,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "expr": "max(node_hwmon_temp_celsius)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "celsius",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 55
                  },
                  {
                    "color": "red",
                    "value": 70
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Memoria disponible",
          "description": "",
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "expr": "node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes * 100",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 10
                  },
                  {
                    "color": "green",
                    "value": 20
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Carga (load 1m)",
          "description": "Referencia: el equipo tiene 4 núcleos.",
          "gridPos": {
            "x": 16,
            "y": 0,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "expr": "node_load1",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 4
                  },
                  {
                    "color": "red",
                    "value": 8
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Pendientes / fallos",
          "description": "",
          "gridPos": {
            "x": 20,
            "y": 0,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "expr": "lab_pending_updates",
              "refId": "A",
              "legendFormat": "actualizaciones pendientes"
            },
            {
              "expr": "lab_systemd_failed_units",
              "refId": "B",
              "legendFormat": "units fallidas"
            },
            {
              "expr": "lab_reboot_required",
              "refId": "C",
              "legendFormat": "reinicio requerido"
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {
            "colorMode": "none",
            "textMode": "value_and_name",
            "graphMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Lectura por disco",
          "description": "",
          "gridPos": {
            "x": 0,
            "y": 4,
            "w": 8,
            "h": 8
          },
          "targets": [
            {
              "expr": "rate(node_disk_read_bytes_total{device=~\"sd[a-d]\"}[$__rate_interval])",
              "refId": "A",
              "legendFormat": "{{device}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "Bps"
            },
            "overrides": []
          }
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Escritura por disco",
          "description": "",
          "gridPos": {
            "x": 8,
            "y": 4,
            "w": 8,
            "h": 8
          },
          "targets": [
            {
              "expr": "rate(node_disk_written_bytes_total{device=~\"sd[a-d]\"}[$__rate_interval])",
              "refId": "A",
              "legendFormat": "{{device}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "Bps"
            },
            "overrides": []
          }
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Utilización de cada disco (%)",
          "description": "Porcentaje del tiempo que el disco estuvo ocupado. Cerca de 100 = disco saturado.",
          "gridPos": {
            "x": 16,
            "y": 4,
            "w": 8,
            "h": 8
          },
          "targets": [
            {
              "expr": "rate(node_disk_io_time_seconds_total{device=~\"sd[a-d]\"}[$__rate_interval]) * 100",
              "refId": "A",
              "legendFormat": "{{device}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100
            },
            "overrides": []
          }
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Presión PSI (% del tiempo detenido o esperando)",
          "description": "PSI del kernel. I/O detenido sostenido por encima de 10-20% indica discos saturados.",
          "gridPos": {
            "x": 0,
            "y": 12,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "expr": "rate(node_pressure_io_stalled_seconds_total[$__rate_interval]) * 100",
              "refId": "A",
              "legendFormat": "I/O detenido"
            },
            {
              "expr": "rate(node_pressure_io_waiting_seconds_total[$__rate_interval]) * 100",
              "refId": "B",
              "legendFormat": "I/O esperando"
            },
            {
              "expr": "rate(node_pressure_cpu_waiting_seconds_total[$__rate_interval]) * 100",
              "refId": "C",
              "legendFormat": "CPU esperando"
            },
            {
              "expr": "rate(node_pressure_memory_stalled_seconds_total[$__rate_interval]) * 100",
              "refId": "D",
              "legendFormat": "Memoria detenida"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0
            },
            "overrides": []
          }
        },
        {
          "id": 10,
          "type": "bargauge",
          "title": "Espacio libre por montaje",
          "description": "Rojo por debajo de 20 GB libres, verde por encima de 50 GB. lab-check usa 20 GB como mínimo.",
          "gridPos": {
            "x": 12,
            "y": 12,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "expr": "node_filesystem_avail_bytes{fstype=~\"ext4|fuse.mergerfs\",mountpoint!=\"/home/user/media\"}",
              "refId": "A",
              "legendFormat": "{{mountpoint}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 21474836480
                  },
                  {
                    "color": "green",
                    "value": 53687091200
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "orientation": "horizontal",
            "displayMode": "gradient",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "Temperaturas (hwmon)",
          "description": "",
          "gridPos": {
            "x": 0,
            "y": 20,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "expr": "node_hwmon_temp_celsius",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "celsius"
            },
            "overrides": []
          }
        },
        {
          "id": 12,
          "type": "table",
          "title": "SMART: atributos crudos",
          "description": "Todos los atributos tal como los exporta lab-host-metrics. Se afinará a los críticos (sector pendiente, CRC).",
          "gridPos": {
            "x": 12,
            "y": 20,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "expr": "lab_smart_attribute_raw",
              "refId": "A",
              "instant": true,
              "format": "table"
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {
            "showHeader": true,
            "sortBy": [
              {
                "displayName": "Value",
                "desc": true
              }
            ]
          },
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "__name__": true,
                  "job": true,
                  "instance": true
                }
              }
            }
          ]
        }
      ]
    }
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
