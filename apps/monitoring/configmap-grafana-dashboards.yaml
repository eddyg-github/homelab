          "options": {
            "colorMode": "none",
            "textMode": "value_and_name",
            "graphMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Lectura por disco",
          "description": "",
          "gridPos": {
            "x": 0,
            "y": 4,
            "w": 8,
            "h": 8
          },
          "targets": [
            {
              "expr": "rate(node_disk_read_bytes_total{device=~\"sd[a-d]\"}[$__rate_interval])",
