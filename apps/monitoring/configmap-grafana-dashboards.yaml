            "x": 0,
            "y": 12,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "expr": "rate(node_pressure_io_stalled_seconds_total[$__rate_interval]) * 100",
              "refId": "A",
              "legendFormat": "I/O detenido"
            },
            {
              "expr": "rate(node_pressure_io_waiting_seconds_total[$__rate_interval]) * 100",
              "refId": "B",
              "legendFormat": "I/O esperando"
            },
            {
              "expr": "rate(node_pressure_cpu_waiting_seconds_total[$__rate_interval]) * 100",
              "refId": "C",
              "legendFormat": "CPU esperando"
            },
            {
              "expr": "rate(node_pressure_memory_stalled_seconds_total[$__rate_interval]) * 100",
              "refId": "D",
              "legendFormat": "Memoria detenida"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0
            },
            "overrides": []
          }
        },
        {
          "id": 10,
          "type": "bargauge",
          "title": "Espacio libre por montaje",
          "description": "Rojo por debajo de 20 GB libres, verde por encima de 50 GB. lab-check usa 20 GB como mínimo.",
          "gridPos": {
            "x": 12,
            "y": 12,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "expr": "node_filesystem_avail_bytes{fstype=~\"ext4|fuse.mergerfs\",mountpoint!=\"/home/user/media\"}",
              "refId": "A",
              "legendFormat": "{{mountpoint}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 21474836480
                  },
                  {
                    "color": "green",
                    "value": 53687091200
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "orientation": "horizontal",
            "displayMode": "gradient",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "Temperaturas (hwmon)",
          "description": "",
          "gridPos": {
            "x": 0,
            "y": 20,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "expr": "node_hwmon_temp_celsius",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "celsius"
            },
            "overrides": []
          }
        },
        {
          "id": 12,
          "type": "table",
          "title": "SMART: atributos crudos",
          "description": "Todos los atributos tal como los exporta lab-host-metrics. Se afinará a los críticos (sector pendiente, CRC).",
          "gridPos": {
            "x": 0,
            "y": 34,
            "w": 24,
            "h": 8
          },
          "targets": [
            {
              "expr": "lab_smart_attribute_raw",
              "refId": "A",
              "instant": true,
              "format": "table"
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {
            "showHeader": true,
            "sortBy": [
              {
                "displayName": "Value",
                "desc": true
              }
            ]
          },
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "__name__": true,
                  "job": true,
                  "instance": true
                }
              }
            }
          ]
        },
        {
          "id": 13,
          "type": "stat",
          "title": "Sectores pendientes",
          "description": "Sectores que el disco no pudo leer y espera reubicar. Cualquier valor mayor a 0 conviene vigilarlo (sdd tiene 1).",
          "gridPos": {
            "x": 0,
            "y": 28,
            "w": 8,
            "h": 6
          },
          "targets": [
            {
              "expr": "lab_smart_attribute_raw{name=\"current_pending_sector\"}",
              "refId": "A",
              "legendFormat": "{{device}}",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 5
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "textMode": "value_and_name",
            "graphMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "id": 14,
          "type": "stat",
          "title": "Errores CRC acumulados",
          "description": "Contador de por vida: un número alto no significa problema activo. Mirá el panel de 24 h. Suele ser cable SATA.",
          "gridPos": {
            "x": 8,
            "y": 28,
            "w": 8,
            "h": 6
          },
          "targets": [
            {
              "expr": "lab_smart_attribute_raw{name=\"udma_crc_error_count\"}",
              "refId": "A",
              "legendFormat": "{{device}}",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "textMode": "value_and_name",
            "graphMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "id": 15,
          "type": "stat",
          "title": "Errores CRC nuevos en 24 h",
          "description": "Si es mayor a 0, el cable o puerto SATA sigue dando errores ahora.",
          "gridPos": {
            "x": 16,
            "y": 28,
            "w": 8,
            "h": 6
          },
          "targets": [
            {
              "expr": "delta(lab_smart_attribute_raw{name=\"udma_crc_error_count\"}[24h])",
              "refId": "A",
              "legendFormat": "{{device}}",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "textMode": "value_and_name",
            "graphMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        }
      ]
    }
  servidor-recursos.json: |-
    {
      "title": "Servidor: CPU, memoria y red",
      "uid": "servidor-recursos",
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "tags": [
        "host"
      ],
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "CPU usada",
          "description": "",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "expr": "100 - avg(rate(node_cpu_seconds_total{mode=\"idle\"}[$__rate_interval])) * 100",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 70
                  },
                  {
                    "color": "red",
                    "value": 90
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "textMode": "auto",
            "graphMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Memoria usada",
          "description": "",
          "gridPos": {
            "x": 4,
            "y": 0,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "expr": "(1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 80
                  },
                  {
                    "color": "red",
                    "value": 90
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "textMode": "auto",
            "graphMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Swap usada",
          "description": "",
          "gridPos": {
            "x": 8,
            "y": 0,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "expr": "node_memory_SwapTotal_bytes - node_memory_SwapFree_bytes",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 536870912
                  },
                  {
                    "color": "red",
                    "value": 2147483648
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "textMode": "auto",
            "graphMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Carga (1 min)",
          "description": "El equipo tiene 4 núcleos: cerca de 4 = al límite.",
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "expr": "node_load1",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 4
                  },
                  {
                    "color": "red",
                    "value": 8
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "textMode": "auto",
            "graphMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Tiempo encendido",
          "description": "",
          "gridPos": {
            "x": 16,
            "y": 0,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "expr": "time() - node_boot_time_seconds",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "colorMode": "none",
            "textMode": "auto",
            "graphMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Procesos esperando CPU (PSI)",
          "description": "",
          "gridPos": {
            "x": 20,
            "y": 0,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "expr": "rate(node_pressure_cpu_waiting_seconds_total[$__rate_interval]) * 100",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 10
                  },
                  {
                    "color": "red",
                    "value": 30
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "textMode": "auto",
            "graphMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "CPU por modo (% del total)",
          "description": "",
          "gridPos": {
            "x": 0,
            "y": 4,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "expr": "sum by (mode) (rate(node_cpu_seconds_total{mode!=\"idle\"}[$__rate_interval])) / scalar(count(count by (cpu) (node_cpu_seconds_total))) * 100",
              "refId": "A",
              "legendFormat": "{{mode}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "custom": {
                "stacking": {
                  "mode": "normal"
                },
                "fillOpacity": 30
              }
            },
            "overrides": []
          }
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Carga del sistema",
          "description": "Comparar con 4 núcleos.",
          "gridPos": {
            "x": 12,
            "y": 4,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "expr": "node_load1",
              "refId": "A",
              "legendFormat": "load 1m"
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          }
        },
