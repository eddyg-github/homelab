apiVersion: v1
data:
  cluster-overview.json: "{\n  \"title\": \"Cluster Overview\",\n  \"uid\": \"cluster-overview\"\
    ,\n  \"schemaVersion\": 27,\n  \"panels\": [\n    {\n      \"type\": \"stat\"\
    ,\n      \"title\": \"Pods Running\",\n      \"gridPos\": {\"x\": 0, \"y\": 0,\
    \ \"w\": 6, \"h\": 4},\n      \"targets\": [{\"expr\": \"count(kube_pod_status_phase{phase=\\\
    \"Running\\\"})\", \"refId\": \"A\"}]\n    },\n    {\n      \"type\": \"stat\"\
    ,\n      \"title\": \"Pods con Errores\",\n      \"gridPos\": {\"x\": 6, \"y\"\
    : 0, \"w\": 6, \"h\": 4},\n      \"targets\": [{\"expr\": \"count(kube_pod_status_phase{phase=~\\\
    \"Failed|Unknown\\\"})\", \"refId\": \"A\"}]\n    },\n    {\n      \"type\": \"\
    stat\",\n      \"title\": \"CrashLoopBackOff activos\",\n      \"gridPos\": {\"\
    x\": 12, \"y\": 0, \"w\": 6, \"h\": 4},\n      \"targets\": [{\"expr\": \"count(kube_pod_container_status_waiting_reason{reason=\\\
    \"CrashLoopBackOff\\\"})\", \"refId\": \"A\"}]\n    },\n    {\n      \"type\"\
    : \"graph\",\n      \"title\": \"Reinicios por pod (5m)\",\n      \"gridPos\"\
    : {\"x\": 0, \"y\": 4, \"w\": 24, \"h\": 8},\n      \"targets\": [{\"expr\": \"\
    rate(kube_pod_container_status_restarts_total[5m]) > 0\", \"legendFormat\": \"\
    {{namespace}}/{{pod}}\", \"refId\": \"A\"}]\n    }\n  ],\n  \"time\": {\"from\"\
    : \"now-1h\", \"to\": \"now\"},\n  \"refresh\": \"30s\"\n}\n"
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring

