apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - git:
        repoURL: git@github.com:eddyg-github/homelab.git
        revision: main
        directories:
          - path: apps/*
  template:
    metadata:
      name: 'app-{{.path.basename}}'
    spec:
      project: default
      source:
        repoURL: git@github.com:eddyg-github/homelab.git
        targetRevision: main
        path: '{{.path.path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: argocd
      syncPolicy:
        automated: { prune: false, selfHeal: true }
        syncOptions: [ServerSideApply=true]
